project_name: RICCE
dataset_root: data
artifact_root: artifacts
result_root: results

datasets:
  LEVIR_CC:
    enabled: true
    candidates: [LEVIR_CCaption, Levir-CC-dataset-002, Levir-CC-dataset-002.zip, LevirCC, "LevirCC (1).rar"]
  SECOND_CC:
    enabled: true
    candidates: [SECOND-CC-AUG, SECOND-CC]
  DUBAI_CC:
    enabled: true
    candidates: [DubaiCC, Dubai-CC, "DubaiCC (1).rar"]
  RSCC:
    enabled: true
    candidates: [RSCC, RSCC_xbd_subset]

ontology:
  object: configs/ontology/object.yaml
  action: configs/ontology/action.yaml
  location: configs/ontology/location.yaml
  quantity: configs/ontology/quantity.yaml

parser:
  use_embeddings: true
  embedding_model: sentence-transformers/all-MiniLM-L6-v2
  similarity_threshold: 0.58


vlm:
  model_name_or_path: Qwen/Qwen2.5-VL-7B-Instruct
  max_new_tokens: 96
  temperature: 0.0
  prompt: >
    You are given two remote-sensing images of the same area at two different times.
    The first image is T1 and the second is T2. Describe only meaningful changes from T1 to T2.
    Mention changed objects or land-cover, direction of change, approximate location, and quantity when visible.
    Do not invent details. If there is no meaningful change, state that clearly.

training:
  seeds: [42, 123, 2026]
  model_name_or_path: Qwen/Qwen2.5-VL-7B-Instruct
  output_root: checkpoints
  learning_rate: 0.00002
  grad_accum: 8
  epochs: 1
  max_length: 1024
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  beta: 0.1
  tcpo_lambda: 1.0
