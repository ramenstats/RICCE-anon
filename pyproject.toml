[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ricce"
version = "0.1.0"
description = "Taxonomy-aware evaluation and learning for remote-sensing change captioning"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24", "pandas>=2.0", "pillow>=10.0", "pyyaml>=6.0",
  "scipy>=1.10", "scikit-learn>=1.3", "tqdm>=4.66", "matplotlib>=3.8",
  "nltk>=3.8", "rouge-score>=0.1.2", "sacrebleu>=2.4",
  "sentence-transformers>=3.0", "bert-score>=0.3.13",
  "typer>=0.12", "rich>=13.7", "pytest>=8.0"
]

[project.optional-dependencies]
vlm = ["torch>=2.4", "transformers>=4.49", "accelerate>=1.0", "peft>=0.13", "bitsandbytes>=0.43"]
spice = ["pycocoevalcap"]

[project.scripts]
ricce = "ricce.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["ricce*"]
